---
# Local testing overlay: a self-contained sibling of ../replicated for running on a
# local cluster (kind/minikube/k3d) without the run-integration-test GitHub Action.
#
# Differences from ../replicated:
# - Resource attributes are set to static literal values instead of ${env:...} vars
#   populated by the CI action, so no integration-test-info.env / configMapGenerator
#   is needed (the collector errors on startup if an ${env:...} var is unset).
# - Adds a `debug` exporter to the logs pipeline so telemetry is visible on the
#   collector pod's stdout locally (kubectl logs) in addition to the OTLP/HTTP export.
namePrefix: local-

resources:
- ../../bases/opentelemetry-collectors

patches:
# Update all collectors to set the exporter endpoints and any other common overrides.
- target:
    group: opentelemetry.io
    version: v1beta1
    kind: OpenTelemetryCollector
  patch: |-
    - op: add
      path: /spec/config/exporters/otlp_http
      value:
        # otlp_http appends the signal-specific path (eg: /v1/logs) to this endpoint.
        endpoint: https://otlp.stackable.build
        auth:
          authenticator: bearertokenauth
    - op: add
      path: /spec/config/exporters/debug
      value:
        verbosity: detailed
    # The ingester at otlp.stackable.build requires Bearer auth. The token is read from
    # the OTLP_BEARER_TOKEN env var, sourced from the otlp-auth Secret (spec/env below).
    # Locally that Secret is built by the secretGenerator from a gitignored otlp-auth.env.
    - op: add
      path: /spec/config/extensions/bearertokenauth
      value:
        token: ${env:OTLP_BEARER_TOKEN}
    - op: add
      path: /spec/config/service/extensions/-
      value: bearertokenauth
    - op: add
      path: /spec/env/-
      value:
        name: OTLP_BEARER_TOKEN
        valueFrom:
          secretKeyRef:
            name: otlp-auth
            key: bearer-token
    - op: add
      path: /spec/config/service/pipelines/logs/exporters/-
      value: otlp_http
    - op: add
      path: /spec/config/service/pipelines/logs/exporters/-
      value: debug
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: k8s.cluster.name
        value: local
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: k8s.cluster.distribution
        value: local
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: k8s.cluster.version
        value: local
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: github.actions.triggered_by
        value: local

# Specifically override config for the kubernetes-events collector.
- target:
    group: opentelemetry.io
    version: v1beta1
    kind: OpenTelemetryCollector
    name: kubernetes-events
  patch: |-
    # OpenSearch Metrics collector is not yet available
    - op: remove
      path: /spec/config/service/pipelines/metrics

secretGenerator:
# Local-only: builds the otlp-auth Secret from a gitignored otlp-auth.secret.env so the
# token is never committed. Copy otlp-auth.secret.env.example to otlp-auth.secret.env and
# set the real token. The generated (hashed) Secret name is rewritten into each collector's
# spec.env via the Secret nameReference in ../../bases/opentelemetry-collectors/crds.yml.
- name: otlp-auth
  namespace: opentelemetry-operator
  envs:
  - otlp-auth.secret.env
