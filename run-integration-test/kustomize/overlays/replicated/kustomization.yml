---
namePrefix: replicated-

resources:
- ../../bases/opentelemetry-collectors

patches:
# Update all collectors to set the exporter endpoints and any other common overrides.
- target:
    group: opentelemetry.io
    version: v1beta1
    kind: OpenTelemetryCollector
  patch: |-
    - op: add
      path: /spec/config/exporters/otlp_http
      value:
        # otlp_http appends the signal-specific path (eg: /v1/logs) to this endpoint.
        # Note: the exporter was renamed from `otlphttp` to `otlp_http`; the old name
        # is a deprecated alias that still works but will be removed in a future release.
        endpoint: https://otlp.stackable.build
        auth:
          authenticator: bearertokenauth
    # The ingester at otlp.stackable.build requires Bearer auth. The token is read from
    # the OTLP_BEARER_TOKEN env var, sourced from the otlp-auth Secret (spec/env below).
    # In CI this Secret is created by the run-integration-test action from a GHA secret.
    - op: add
      path: /spec/config/extensions/bearertokenauth
      value:
        token: ${env:OTLP_BEARER_TOKEN}
    - op: add
      path: /spec/config/service/extensions/-
      value: bearertokenauth
    - op: add
      path: /spec/env/-
      value:
        name: OTLP_BEARER_TOKEN
        valueFrom:
          secretKeyRef:
            name: otlp-auth
            key: bearer-token
    - op: add
      path: /spec/config/service/pipelines/logs/exporters/-
      value: otlp_http
    - op: add
      path: /spec/envFrom/-
      value:
        configMapRef:
          name: integration-test-info
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: k8s.cluster.name
        value: ${env:KUBERNETES_CLUSTER_NAME}
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: k8s.cluster.distribution
        value: ${env:KUBERNETES_DISTRIBUTION}
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: k8s.cluster.version
        value: ${env:KUBERNETES_VERSION}
    - op: add
      path: /spec/config/processors/resource/attributes/-
      value:
        action: upsert
        key: github.actions.triggered_by
        value: ${env:TRIGGERED_BY}

# Specifically override config for the kubernetes-events collector.
- target:
    group: opentelemetry.io
    version: v1beta1
    kind: OpenTelemetryCollector
    name: kubernetes-events
  patch: |-
    # OpenSearch Metrics collector is not yet available
    - op: remove
      path: /spec/config/service/pipelines/metrics
    # - op: add
    # - op: add
    #   path: /spec/config/service/pipelines/metrics/exporters/-
    #   value: otlp_http

configMapGenerator:
# These get used by the attributes processor in each collector
- name: integration-test-info
  namespace: opentelemetry-operator
  envs:
  # KUBERNETES_CLUSTER_NAME
  # KUBERNETES_DISTRIBUTION
  # KUBERNETES_VERSION
  # TRIGGERED_BY
  - integration-test-info.env
