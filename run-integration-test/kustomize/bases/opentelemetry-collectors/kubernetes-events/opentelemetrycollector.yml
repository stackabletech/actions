---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: kubernetes-events
spec:
  serviceAccount: kubernetes-events
  # This key exists so it can be easily extended in an overlay:
  env: []
  # This key exists so it can be easily extended in an overlay:
  envFrom: []
  config:
    receivers:
      # There has to be a value, hence an empty object {}:
      k8s_events: {}
      k8s_cluster:
        # https://kubernetes.io/docs/reference/node/node-status/#condition
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory, ephemeral-storage, storage]
        metrics:
          k8s.container.cpu_limit:
            enabled: false
        resource_attributes:
          container.id:
            enabled: false

    # This key exists so it can be easily extended in an overlay:
    extensions: {}

    processors:
      # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/k8sattributesprocessor
      k8s_attributes:
        # Enrich telemetry with pod metadata (including the owning workload) via the k8s API.
        # The k8s_cluster/k8s_events receivers describe other objects and are not "sent" by
        # those pods, so there is no source connection IP to match on. Associate by the
        # k8s.pod.uid the k8s_cluster receiver stamps as a resource attribute instead.
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata:
            # Owning workload of each pod (deployment is resolved via its replicaset).
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.job.name
            - k8s.cronjob.name

      # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/attributesprocessor
      # These are attributes for the specific spans, log events, etc...
      # For higher level attributes see the "resource" attributes below.
      # attributes:
      #   # This key exists so it can be easily extended in an overlay:
      #   actions: []

      # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/resourceprocessor
      # These are top level attributes about the application as a whole and not any specific event.
      # These are useful for correlating. For span/event specific atrtibutes, see above.
      resource:
        attributes:
          # This is to prevent the event label "service_name" having the value "unknown_service"
          - action: upsert
            key: service.name
            value: kubernetes-events

      resource_detection/env:
        detectors: [env]
        timeout: 2s
        override: false
      # yamllint disable rule:comments-indentation
      # memory_limiter:
      #   check_interval: 1s
      #   limit_percentage: 75
      #   spike_limit_percentage: 15
      # batch:
      #   send_batch_size: 10000
      #   timeout: 10s
      # yamllint enable rule:comments-indentation

    # Configure exporters in the overlay
    exporters: {}

    service:
      # This key exists so it can be easily extended in an overlay:
      extensions: []
      pipelines:
        logs:
          receivers: [k8s_events]
          # processors: [memory_limiter, batch]
          processors: [k8s_attributes, resource_detection/env, resource]
          # Enable configured exporters in the overlay
          exporters: []
        metrics:
          receivers: [k8s_cluster]
          # processors: [memory_limiter, batch]
          processors: [k8s_attributes, resource_detection/env, resource]
          # Enable configured exporters in the overlay
          exporters: []
