---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: kubernetes-objects
spec:
  serviceAccount: kubernetes-objects
  # This key exists so it can be easily extended in an overlay:
  env: []
  # This key exists so it can be easily extended in an overlay:
  envFrom: []
  config:
    receivers:
      # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/k8sobjectsreceiver/testdata/config.yaml
      k8sobjects:
        # This action runs across operator repos, so most Stackable CRDs below will not be
        # installed on any given run. error_mode: ignore makes a missing/unknown object type
        # non-fatal - the receiver logs it and skips it at startup instead of failing.
        # See handleError() in the receiver's Start(): missing types hit `continue`.
        # TODO: Make error_mode runtime-controllable from the workflow (no action bump) by
        # sourcing it from an env var with a safe default:
        #   error_mode: "${env:OTEL_K8SOBJECTS_ERROR_MODE:-ignore}"
        # Requires: an action input, writing it into integration-test-info.env, and this
        # collector receiving that ConfigMap via envFrom (already true in the replicated overlay).
        error_mode: ignore
        objects:
        # NOTE: events are intentionally NOT watched here - they are already collected by the
        # k8s_events receiver in the kubernetes-events collector. Core Secrets are intentionally
        # excluded: k8sobjects emits full object data with no field stripping (would exfiltrate
        # secret material, including this stack's own otlp-auth token).

        # --- Common core (v1) resources ---
        - name: pods
          mode: watch
        - name: services
          mode: watch
        - name: endpoints
          mode: watch
        - name: configmaps
          mode: watch
        - name: persistentvolumeclaims
          mode: watch
        - name: persistentvolumes
          mode: watch
        - name: namespaces
          mode: watch
        - name: nodes
          mode: watch
        - name: serviceaccounts
          mode: watch
        - name: resourcequotas
          mode: watch
        - name: limitranges
          mode: watch

        # --- apps ---
        - name: deployments
          group: apps
          mode: watch
        - name: statefulsets
          group: apps
          mode: watch
        - name: daemonsets
          group: apps
          mode: watch
        - name: replicasets
          group: apps
          mode: watch

        # --- batch ---
        - name: jobs
          group: batch
          mode: watch
        - name: cronjobs
          group: batch
          mode: watch

        # --- networking / scaling / policy / storage ---
        - name: ingresses
          group: networking.k8s.io
          mode: watch
        - name: networkpolicies
          group: networking.k8s.io
          mode: watch
        - name: horizontalpodautoscalers
          group: autoscaling
          mode: watch
        - name: poddisruptionbudgets
          group: policy
          mode: watch
        - name: storageclasses
          group: storage.k8s.io
          mode: watch

        # --- Stackable CRDs (https://hub.stackable.tech/crds) ---
        # Verify plurals against `kubectl get crds` - a wrong plural is silently skipped
        # (error_mode: ignore), so it fails as missing coverage rather than a crash.
        - name: airflowclusters
          group: airflow.stackable.tech
          mode: watch
        - name: druidclusters
          group: druid.stackable.tech
          mode: watch
        - name: hbaseclusters
          group: hbase.stackable.tech
          mode: watch
        - name: hdfsclusters
          group: hdfs.stackable.tech
          mode: watch
        - name: hiveclusters
          group: hive.stackable.tech
          mode: watch
        - name: kafkaclusters
          group: kafka.stackable.tech
          mode: watch
        - name: nificlusters
          group: nifi.stackable.tech
          mode: watch
        - name: sparkapplications
          group: spark.stackable.tech
          mode: watch
        - name: sparkhistoryservers
          group: spark.stackable.tech
          mode: watch
        - name: sparkconnectservers
          group: spark.stackable.tech
          mode: watch
        - name: supersetclusters
          group: superset.stackable.tech
          mode: watch
        - name: druidconnections
          group: superset.stackable.tech
          mode: watch
        - name: trinoclusters
          group: trino.stackable.tech
          mode: watch
        - name: trinocatalogs
          group: trino.stackable.tech
          mode: watch
        - name: zookeeperclusters
          group: zookeeper.stackable.tech
          mode: watch
        - name: zookeeperznodes
          group: zookeeper.stackable.tech
          mode: watch
        - name: opaclusters
          group: opa.stackable.tech
          mode: watch
        - name: opensearchclusters
          group: opensearch.stackable.tech
          mode: watch
        - name: authenticationclasses
          group: authentication.stackable.tech
          mode: watch
        - name: s3connections
          group: s3.stackable.tech
          mode: watch
        - name: s3buckets
          group: s3.stackable.tech
          mode: watch
        - name: listeners
          group: listeners.stackable.tech
          mode: watch
        - name: listenerclasses
          group: listeners.stackable.tech
          mode: watch
        - name: podlisteners
          group: listeners.stackable.tech
          mode: watch
        - name: secretclasses
          group: secrets.stackable.tech
          mode: watch
        - name: truststores
          group: secrets.stackable.tech
          mode: watch

    # This key exists so it can be easily extended in an overlay:
    extensions: {}

    processors:
      # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/k8sattributesprocessor
      k8s_attributes:
        # Use the k8s attributes set by the receiver
        # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor#as-a-gateway
        passthrough: false

      # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/attributesprocessor
      # These are attributes for the specific spans, log events, etc...
      # For higher level attributes see the "resource" attributes below.
      # attributes:
      #   # This key exists so it can be easily extended in an overlay:
      #   actions: []

      # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/resourceprocessor
      # These are top level attributes about the application as a whole and not any specific event.
      # These are useful for correlating. For span/event specific atrtibutes, see above.
      resource:
        attributes:
        # This is to prevent the event label "service_name" having the value "unknown_service"
        - action: upsert
          key: service.name
          value: kubernetes-objects

      resource_detection/env:
        detectors: [env]
        timeout: 2s
        override: false
      # yamllint disable rule:comments-indentation
      # memory_limiter:
      #   check_interval: 1s
      #   limit_percentage: 75
      #   spike_limit_percentage: 15
      # batch:
      #   send_batch_size: 10000
      #   timeout: 10s
      # yamllint enable rule:comments-indentation

    # Configure exporters in the overlay
    exporters: {}

    service:
      # This key exists so it can be easily extended in an overlay:
      extensions: []
      pipelines:
        logs:
          receivers: [k8sobjects]
          # processors: [memory_limiter, batch]
          processors: [k8s_attributes, resource_detection/env, resource]
          # Enable configured exporters in the overlay
          exporters: []
