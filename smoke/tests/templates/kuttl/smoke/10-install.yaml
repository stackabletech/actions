---
apiVersion: v1
kind: Pod
metadata:
  name: smoke
spec:
  # sleep ignores SIGTERM as PID 1, and the namespace has to be gone within the suite's timeout.
  terminationGracePeriodSeconds: 0
  containers:
    - name: smoke
      image: oci.stackable.tech/sdp/tools:1.0.0-stackable0.0.0-dev
      command:
        - sleep
        - infinity
