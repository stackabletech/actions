---
name: smoke-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/smoke-build.yaml
      - build-container-image/action.yaml
      - build-product-image/action.yaml
      - free-disk-space/action.yaml
      - publish-helm-chart/action.yaml
      - publish-image/action.yaml
      - publish-index-manifest/action.yaml
      - send-slack-notification/action.yaml
      - shard/action.yaml
      - smoke/*

permissions: {}

env:
  SDP_VERSION: 1.2.3

jobs:
  generate-matrix:
    name: Generate Version List
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: shard
        uses: ./shard
        with:
          product-name: smoke/container-image
    outputs:
      versions: ${{ steps.shard.outputs.versions }}

  build-container-image:
    name: Build/Publish Smoke Test (${{ matrix.versions }}-${{ matrix.runner.arch }}) Image
    needs: [generate-matrix]
    permissions:
      id-token: write
    runs-on: ${{ matrix.runner.name }}
    strategy:
      matrix:
        runner:
          # Github's ubuntu-latest runners use 24.04. By default Ubicloud's runners use 22.04.
          # We therefore explicitly request 24.04 for them as well.
          - { name: "ubuntu-latest", arch: "amd64" }
          - { name: "ubicloud-standard-8-arm-ubuntu-2404", arch: "arm64" }
        versions: ${{ fromJson(needs.generate-matrix.outputs.versions) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Free Disk Space
        uses: ./free-disk-space

      - name: Build Product Container Image
        id: build
        uses: ./build-product-image
        with:
          product-version: ${{ matrix.versions }}
          sdp-version: ${{ env.SDP_VERSION }}
          boil-config-file: smoke/container-image/boil.toml
          boil-version: latest
          registry-namespace: smoke
          extra-tag-data: pr-321
          product-name: smoke/container-image
          floating-tag: "true"

      - name: Publish Container Image on oci.stackable.tech
        uses: ./publish-image
        with:
          image-registry-uri: oci.stackable.tech
          image-registry-username: robot$smoke+github-action-build
          image-registry-password: ${{ secrets.HARBOR_ROBOT_SMOKE_GITHUB_ACTION_BUILD_SECRET }}
          image-repository: smoke/container-image
          canonical-image-manifest-tag: ${{ steps.build.outputs.canonical-image-manifest-tag }}
          canonical-source-image-uri: ${{ steps.build.outputs.canonical-image-manifest-uri }}
          other-image-manifest-tags: ${{ steps.build.outputs.other-image-manifest-tags }}

  publish-manifests:
    name: Build/Publish ${{ matrix.versions }} Index Manifest
    needs: [generate-matrix, build-container-image]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        versions: ${{ fromJson(needs.generate-matrix.outputs.versions) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # NOTE (@Techassi): I'm not super happy about how this looks/works, but as already mentioned,
      # this should only be a stepping stone towards a more robust solution.
      - name: Extract floating image index manifest tag
        id: extract-floating-tag
        env:
          BOIL_VERSION: latest
        shell: bash
        run: |
          "$GITHUB_ACTION_PATH/../.scripts/actions/install_boil.sh"

          FLOATING_IMAGE_INDEX_MANIFEST_TAG=$(boil tools floating-tag "${SDP_VERSION}-pr-321")
          echo "FLOATING_IMAGE_INDEX_MANIFEST_TAG=[\"$FLOATING_IMAGE_INDEX_MANIFEST_TAG\"]" | tee -a "$GITHUB_OUTPUT"

      - name: Publish and Sign Image Index Manifest to oci.stackable.tech
        uses: ./publish-image-index-manifest
        with:
          image-registry-uri: oci.stackable.tech
          image-registry-username: robot$smoke+github-action-build
          image-registry-password: ${{ secrets.HARBOR_ROBOT_SMOKE_GITHUB_ACTION_BUILD_SECRET }}
          image-repository: smoke/container-image
          canonical-image-index-manifest-tag: ${{ matrix.versions }}-stackable${{ env.SDP_VERSION }}-pr-321
          other-image-index-manifest-tags: ${{ steps.extract-floating-tag.outputs.FLOATING_IMAGE_INDEX_MANIFEST_TAG }}

  publish-helm-chart:
    name: Package/Publish ${{ matrix.versions }} Helm Chart
    needs: [generate-matrix, build-container-image]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        versions: ${{ fromJson(needs.generate-matrix.outputs.versions) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Package, Publish, and Sign Helm Chart
        uses: ./publish-helm-chart
        with:
          chart-registry-uri: oci.stackable.tech
          chart-registry-username: robot$smoke+github-action-build
          chart-registry-password: ${{ secrets.HARBOR_ROBOT_SMOKE_GITHUB_ACTION_BUILD_SECRET }}
          chart-repository: smoke
          chart-directory: smoke/helm-chart
          chart-version: ${{ matrix.versions }}
          app-version: ${{ matrix.versions }}

  notify:
    name: Failure Notification
    needs:
      - generate-matrix
      - build-container-image
      - publish-helm-chart
      - publish-manifests
    runs-on: ubuntu-latest
    if: failure() || github.run_attempt > 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Send Notification
        uses: ./send-slack-notification
        with:
          publish-helm-chart-result: ${{ needs.publish-helm-chart.result }}
          publish-manifests-result: ${{ needs.publish-manifests.result }}
          build-result: ${{ needs.build-container-image.result }}
          slack-token: ${{ secrets.SLACK_CONTAINER_IMAGE_TOKEN }}
          # This tests that the subject is correctly overwritten
          message-subject: Build actions/smoke container image
          # notifications-container-images
          channel-id: C07UG6JH44F
          type: container-image-build
