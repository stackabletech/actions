---
name: Build interu

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      upload:
        default: false
        type: boolean

env:
  RUST_VERSION: 1.97.1

jobs:
  build:
    name: Build interu-${{ inputs.target }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build Binary
        uses: $/build-rust-binary
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ inputs.target }}
          name: interu
          cargo-cyclonedx-version: latest
          cyclonedx-source-path: tools

      - name: Upload Artifact
        if: inputs.upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: interu-${{ inputs.target }}
