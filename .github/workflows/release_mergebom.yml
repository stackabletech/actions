---
name: Release mergebom

on:
  push:
    tags:
      - "mergebom-[0-9]+.[0-9]+.[0-9]+**"

permissions: {}

jobs:
  build:
    uses: $/.github/workflows/build_mergebom.yml
    permissions:
      contents: read
    with:
      upload: true
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubicloud-standard-8-arm-ubuntu-2404

  release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      # Needed for keyless signing with cosign.
      id-token: write
    steps:
      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # The publish-image action verifies these signatures before it runs mergebom, using this
      # workflow and the tag as the certificate identity.
      - name: Sign Binaries
        run: |
          set -euo pipefail
          for BINARY in artifacts/mergebom-*; do
            cosign sign-blob --yes --bundle "${BINARY}.bundle" "$BINARY"
          done

      - name: Upload Release Binaries
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" artifacts/*
