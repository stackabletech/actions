---
name: Build mergebom

on:
  pull_request:
    paths:
      - .github/workflows/release_mergebom.yml
      - .github/workflows/build_mergebom.yml
      - .github/workflows/pr_mergebom.yml
      - rust-toolchain.toml
      - tools/mergebom/**
      - Cargo.toml
      - Cargo.lock

permissions: {}

jobs:
  build:
    uses: $/.github/workflows/build_mergebom.yml
    permissions:
      contents: read
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubicloud-standard-8-arm-ubuntu-2404
